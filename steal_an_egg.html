<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<title>Steal An Egg 3D</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@600;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0b1220;font-family:Nunito,system-ui,sans-serif;touch-action:none;user-select:none;position:fixed;inset:0;overscroll-behavior:none}
#c{display:block;width:100%;height:100%;touch-action:none}
#ui{position:absolute;inset:0;pointer-events:none;color:#fff}
#ui *{pointer-events:auto}
.hud-top{position:absolute;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;z-index:5}
.chip{background:linear-gradient(180deg,rgba(15,23,42,.95),rgba(2,6,23,.95));border:2px solid #38bdf8;border-radius:14px;padding:7px 12px;font-weight:800;font-size:13px;font-family:Fredoka,sans-serif;box-shadow:0 4px 16px #0006}
.chip.gold{border-color:#fbbf24;color:#fde68a}
.chip.green{border-color:#4ade80;color:#bbf7d0}
#prompt{position:absolute;bottom:110px;left:50%;transform:translateX(-50%);background:linear-gradient(180deg,#0f172af5,#020617f5);padding:10px 18px;border-radius:14px;font-weight:800;font-size:14px;display:none;border:2px solid #38bdf8;box-shadow:0 6px 24px #0007;font-family:Fredoka,sans-serif;max-width:92vw;z-index:8}
#toast{position:absolute;top:58px;left:50%;transform:translateX(-50%);background:linear-gradient(180deg,#0f172af5,#020617f5);padding:10px 18px;border-radius:14px;font-weight:800;display:none;z-index:20;max-width:90vw;text-align:center;border:2px solid #38bdf8;font-family:Fredoka,sans-serif;box-shadow:0 8px 24px #0007}
#toolbar{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;z-index:5;max-width:96vw}
.tb{min-width:52px;height:50px;border:none;border-radius:14px;background:linear-gradient(180deg,#0ea5e9,#0284c7);color:#e0f2fe;font-weight:800;font-size:12px;cursor:pointer;border:2px solid #38bdf8;font-family:Fredoka,sans-serif;box-shadow:0 4px 0 #0c4a6e;padding:0 12px}
.tb:active{transform:translateY(2px);box-shadow:0 2px 0 #0c4a6e}
#start{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 18%,#0ea5e9 0%,#0f172a 42%,#020617 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:30;pointer-events:auto}
#start *{pointer-events:auto}
#start button{pointer-events:auto;cursor:pointer;z-index:31;position:relative}
#start h1{font-size:clamp(26px,7vw,46px);color:#e0f2fe;text-shadow:0 4px 0 #0c4a6e;font-family:Fredoka,sans-serif}
#start p{color:#7dd3fc;text-align:center;max-width:360px;line-height:1.5;padding:0 16px;font-size:14px}
#start button{background:linear-gradient(180deg,#38bdf8,#0ea5e9);color:#0f172a;border:none;border-radius:16px;padding:15px 44px;font-size:20px;font-weight:900;cursor:pointer;font-family:Fredoka,sans-serif;box-shadow:0 8px 0 #0369a1}
#joy-zone{position:absolute;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));width:140px;height:140px;display:none;touch-action:none;z-index:6}
#joy-base{width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16),rgba(255,255,255,.04));border:3px solid rgba(56,189,248,.45);position:relative}
#joy-knob{width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#7dd3fc 55%,#0ea5e9);position:absolute;left:39px;top:39px;box-shadow:0 4px 12px #0006}
#btn-zone{position:absolute;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));display:none;flex-direction:column;gap:12px;align-items:flex-end;z-index:6}
.act{width:70px;height:70px;border-radius:50%;border:3px solid #fff5;background:radial-gradient(circle at 35% 30%,#0ea5e9,#0369a1);color:#fff;font-weight:900;font-size:13px;display:grid;place-items:center;font-family:Fredoka,sans-serif;box-shadow:0 4px 12px #0005}
.act.primary{background:radial-gradient(circle at 35% 30%,#fbbf24,#d97706);color:#1c1000;border-color:#fde68a}
#panel{position:absolute;top:48%;left:50%;transform:translate(-50%,-50%);width:min(360px,94vw);max-height:75vh;overflow:auto;background:linear-gradient(180deg,#1e293b,#0f172a);border:3px solid #38bdf8;border-radius:16px;display:none;box-shadow:0 20px 60px #000a;z-index:25;font-family:Fredoka,sans-serif;color:#fff}
#panel .panel-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:linear-gradient(180deg,#0ea5e9,#0284c7)}
#panel .panel-head h2{margin:0;font-size:16px}
#panel .close{background:#ef4444;color:#fff;border:none;border-radius:8px;width:32px;height:32px;font-weight:900;cursor:pointer}
#panel .body{padding:12px 14px 16px}
#panel .row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #334155;font-size:14px}
.rarity{font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px}
.rarity.common{background:#6b7280}.rarity.uncommon{background:#16a34a}.rarity.rare{background:#2563eb}
.rarity.legendary{background:#d97706}.rarity.divine{background:#db2777}
#pc-keys{position:absolute;left:12px;bottom:14px;display:none;flex-direction:column;gap:4px;pointer-events:none;z-index:4;font-family:Fredoka,sans-serif;font-size:11px;opacity:.8}
#pc-keys span{background:rgba(0,0,0,.5);border:1px solid #38bdf866;border-radius:8px;padding:3px 8px;width:fit-content}
#pc-keys kbd{display:inline-block;background:#0c4a6e;border:1px solid #38bdf8;border-radius:4px;padding:1px 5px;margin-right:4px;font-weight:800}
@media(max-width:900px),(pointer:coarse){#joy-zone,#btn-zone{display:flex}#toolbar{bottom:calc(160px + env(safe-area-inset-bottom))}#prompt{bottom:calc(270px + env(safe-area-inset-bottom))}}
@media(min-width:901px) and (pointer:fine){#pc-keys{display:flex}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="hud-top">
    <div class="chip" id="chip-speed">⚡ 5,000</div>
    <div class="chip gold" id="chip-money">💰 $0</div>
    <div class="chip green" id="chip-pets">🐣 0 pets</div>
  </div>
  <div id="prompt">Nhấn E để cướp trứng</div>
  <div id="toast"></div>
  <div id="toolbar">
    <button class="tb" id="btn-treadmill">🏋️ Treadmill</button>
    <button class="tb" id="btn-pets">🐣 Pets</button>
    <button class="tb" id="btn-base">🏠 Base</button>
  </div>
  <div id="joy-zone"><div id="joy-base"><div id="joy-knob"></div></div></div>
  <div id="btn-zone"><div class="act primary" id="btn-action">🥚</div></div>
  <div id="pc-keys">
    <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Di chuyển</span>
    <span><kbd>E</kbd> Cướp / Ấp trứng</span>
    <span><kbd>Shift</kbd> Chạy nhanh</span>
  </div>
</div>
<div id="panel">
  <div class="panel-head"><h2 id="panel-title">Pets</h2><button class="close" id="panel-close">✕</button></div>
  <div class="body" id="panel-body"></div>
</div>
<div id="start">
  <h1>🥚 Steal An Egg 3D</h1>
  <p>Cướp trứng từ các biome, chạy về Base trước khi Guardian bắt được. Ấp pet để kiếm tiền và tăng Speed.</p>
  <button id="play" type="button">▶ Bắt đầu</button>
  <p id="load-err" style="color:#f87171;font-size:13px;display:none;max-width:320px"></p>
</div>
<script>
// Fallback: luôn cho bấm được nút (ẩn màn hình chờ)
(function(){
  function hideStart(){
    var s=document.getElementById('start');
    if(s) s.style.display='none';
  }
  var btn=document.getElementById('play');
  if(btn){
    btn.addEventListener('click', function(){
      // Module sẽ gắn handler chính; fallback chỉ ẩn nếu module lỗi
      setTimeout(function(){
        var s=document.getElementById('start');
        if(s && s.style.display!=='none'){
          // module chưa ẩn -> có lỗi JS
          var err=document.getElementById('load-err');
          if(err){ err.style.display='block'; err.textContent='Đang tải game... Nếu không vào được, mở file bằng Chrome (không dùng trình duyệt cũ).'; }
        }
      }, 800);
    });
  }
})();
</script>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
// Dùng THREE global (không cần module) — chạy được khi mở file trực tiếp
const THREE = window.THREE;
if(!THREE){
  document.getElementById('load-err') && (document.getElementById('load-err').style.display='block',
    document.getElementById('load-err').textContent='Không tải được Three.js. Cần internet lần đầu.');
}
const IS_TOUCH = matchMedia('(pointer: coarse)').matches || innerWidth < 900;
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: !IS_TOUCH, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, IS_TOUCH ? 1.4 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87b8e0);
scene.fog = new THREE.Fog(0x87b8e0, 35, 110);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 180);
scene.add(new THREE.HemisphereLight(0xb1e1ff, 0x8b5a2b, 0.75));
const sun = new THREE.DirectionalLight(0xfff4e0, 1.15);
sun.position.set(25, 45, 15);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
scene.add(sun);

const BIOMES = [
  { id:'base', name:'Base', z:0, color:0x4ade80, speed:0, egg:null, income:0, rarity:null, guardian:null },
  { id:'forest', name:'Forest', z:-28, color:0x22c55e, speed:0, egg:'Chicken Egg', income:8, rarity:'common', guardian:'Chicken' },
  { id:'lake', name:'Lake', z:-55, color:0x38bdf8, speed:900, egg:'Frog Egg', income:35, rarity:'uncommon', guardian:'Swan' },
  { id:'desert', name:'Desert', z:-82, color:0xfbbf24, speed:10000, egg:'Jerboa Egg', income:120, rarity:'rare', guardian:'Scorpion' },
  { id:'ocean', name:'Abyss Ocean', z:-110, color:0x1e40af, speed:2500000, egg:'Whale Egg', income:4200, rarity:'legendary', guardian:'Whale' },
  { id:'volcano', name:'Volcano', z:-140, color:0xef4444, speed:700000, egg:'Cerberus Egg', income:8500, rarity:'legendary', guardian:'Cerberus' },
  { id:'prehistoric', name:'Prehistoric', z:-170, color:0xf97316, speed:18000000, egg:'T-Rex Egg', income:89121, rarity:'legendary', guardian:'T-Rex' },
  { id:'temple', name:'Titan Temple', z:-200, color:0xa16207, speed:7000000000, egg:'Gorilla Egg', income:120000000, rarity:'divine', guardian:'Gorilla' },
  { id:'cherry', name:'Cherry Blossom', z:-230, color:0xf9a8d4, speed:2500000000, egg:'Kitsune Egg', income:85000000, rarity:'divine', guardian:'Kitsune' },
  { id:'angels', name:'Angels & Demons', z:-260, color:0xfde68a, speed:20000000000, egg:'ArchAngel Egg', income:500000000, rarity:'divine', guardian:'ArchAngel' },
];

const save = { speed:5000, money:0, pets:[], carrying:null };
let player, carryingMesh=null, petMesh=null, eggs=[], guardians=[], keys={}, joyX=0, joyY=0, animT=0;

function box(w,h,d,color,y=0){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), new THREE.MeshStandardMaterial({color,roughness:0.55,metalness:0.1}));
  m.position.y=y; m.castShadow=true; m.receiveShadow=true; return m;
}
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.style.display='block'; clearTimeout(el._t); el._t=setTimeout(()=>el.style.display='none',2400); }
function updateHUD(){
  document.getElementById('chip-speed').textContent=`⚡ ${save.speed.toLocaleString()}`;
  document.getElementById('chip-money').textContent=`💰 $${save.money.toLocaleString()}`;
  document.getElementById('chip-pets').textContent=`🐣 ${save.pets.length} pets`;
}

function createPlayer(){
  const g=new THREE.Group();
  const legL=box(0.28,0.55,0.32,0x1e3a5f,0.35); legL.position.x=-0.18;
  const legR=box(0.28,0.55,0.32,0x1e3a5f,0.35); legR.position.x=0.18;
  const body=box(0.72,0.85,0.42,0x3b82f6,1.1);
  const head=box(0.52,0.52,0.52,0xf5c6a5,1.78);
  const eyeMat=new THREE.MeshStandardMaterial({color:0x111827});
  const eyeL=new THREE.Mesh(new THREE.BoxGeometry(0.11,0.11,0.08),eyeMat); eyeL.position.set(-0.13,1.82,0.26);
  const eyeR=eyeL.clone(); eyeR.position.x=0.13;
  const armL=box(0.22,0.6,0.24,0x3b82f6,1.15); armL.position.x=-0.52;
  const armR=box(0.22,0.6,0.24,0x3b82f6,1.15); armR.position.x=0.52;
  const hair=box(0.56,0.18,0.56,0xf59e0b,2.08);
  g.add(legL,legR,body,head,eyeL,eyeR,armL,armR,hair);
  g.userData={legs:[legL,legR],arms:[armL,armR]};
  g.position.set(0,0,2); scene.add(g); return g;
}
player=createPlayer();

function createMap(){
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(26,320), new THREE.MeshStandardMaterial({color:0x3d8b5a,roughness:0.9}));
  ground.rotation.x=-Math.PI/2; ground.position.set(0,0,-130); ground.receiveShadow=true; scene.add(ground);
  BIOMES.forEach((b,i)=>{
    if(i===0) return;
    const plane=new THREE.Mesh(new THREE.PlaneGeometry(24,24), new THREE.MeshStandardMaterial({color:b.color,roughness:0.85}));
    plane.rotation.x=-Math.PI/2; plane.position.set(0,0.03,b.z); plane.receiveShadow=true; scene.add(plane);
    const c=document.createElement('canvas'); c.width=256; c.height=64;
    const ctx=c.getContext('2d'); ctx.fillStyle='#00000099'; ctx.fillRect(0,0,256,64);
    ctx.fillStyle='#fff'; ctx.font='bold 26px Arial'; ctx.textAlign='center'; ctx.fillText(b.name,128,40);
    const label=new THREE.Mesh(new THREE.PlaneGeometry(7,1.7), new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c),transparent:true,side:THREE.DoubleSide}));
    label.position.set(0,3.2,b.z+9); scene.add(label);
  });
  const fenceMat=new THREE.MeshStandardMaterial({color:0x5c4033});
  for(let z=12;z>-275;z-=3.5) for(const x of [-12.5,12.5]){
    const post=new THREE.Mesh(new THREE.BoxGeometry(0.28,1.5,0.28),fenceMat); post.position.set(x,0.75,z); post.castShadow=true; scene.add(post);
  }
  const base=new THREE.Mesh(new THREE.CylinderGeometry(6,6.5,0.4,24), new THREE.MeshStandardMaterial({color:0x86efac,roughness:0.7}));
  base.position.set(0,0.15,3); base.receiveShadow=true; scene.add(base);

  // ===== MÁY CHẠY BỘ (Treadmill) =====
  const tm = new THREE.Group();
  // Base của máy
  const tmBase = new THREE.Mesh(
    new THREE.BoxGeometry(2.2, 0.25, 4.5),
    new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.4, metalness: 0.3 })
  );
  tmBase.position.y = 0.15; tmBase.castShadow = true; tm.add(tmBase);
  // Băng chạy
  const belt = new THREE.Mesh(
    new THREE.BoxGeometry(1.6, 0.12, 3.8),
    new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.7 })
  );
  belt.position.set(0, 0.28, 0); tm.add(belt);
  // Thanh cầm
  const handleL = new THREE.Mesh(
    new THREE.BoxGeometry(0.12, 1.1, 0.12),
    new THREE.MeshStandardMaterial({ color: 0x0ea5e9, metalness: 0.5 })
  );
  handleL.position.set(-0.85, 0.9, -1.8); tm.add(handleL);
  const handleR = handleL.clone(); handleR.position.x = 0.85; tm.add(handleR);
  const handleBar = new THREE.Mesh(
    new THREE.BoxGeometry(1.8, 0.1, 0.1),
    new THREE.MeshStandardMaterial({ color: 0x0ea5e9, metalness: 0.5 })
  );
  handleBar.position.set(0, 1.4, -1.8); tm.add(handleBar);
  // Màn hình
  const screen = new THREE.Mesh(
    new THREE.BoxGeometry(0.9, 0.55, 0.08),
    new THREE.MeshStandardMaterial({ color: 0x0f172a, emissive: 0x0ea5e9, emissiveIntensity: 0.3 })
  );
  screen.position.set(0, 1.5, -1.85); tm.add(screen);
  // Chữ trên máy
  const canvasTm = document.createElement('canvas');
  canvasTm.width = 128; canvasTm.height = 64;
  const ctxTm = canvasTm.getContext('2d');
  ctxTm.fillStyle = '#0f172a'; ctxTm.fillRect(0,0,128,64);
  ctxTm.fillStyle = '#38bdf8'; ctxTm.font = 'bold 18px Arial'; ctxTm.textAlign = 'center';
  ctxTm.fillText('TREADMILL', 64, 28);
  ctxTm.fillStyle = '#4ade80'; ctxTm.font = '14px Arial';
  ctxTm.fillText('+SPEED', 64, 50);
  const texTm = new THREE.CanvasTexture(canvasTm);
  const labelTm = new THREE.Mesh(
    new THREE.PlaneGeometry(0.85, 0.42),
    new THREE.MeshBasicMaterial({ map: texTm })
  );
  labelTm.position.set(0, 1.5, -1.81); tm.add(labelTm);

  tm.position.set(4.5, 0, 4);
  scene.add(tm);
  window.__treadmill = tm;

  // ===== CHUỒNG ẤP TRỨNG (Hatching Pen) =====
  const pen = new THREE.Group();
  // Sàn chuồng
  const penFloor = new THREE.Mesh(
    new THREE.BoxGeometry(5, 0.15, 5),
    new THREE.MeshStandardMaterial({ color: 0x854d0e, roughness: 0.8 })
  );
  penFloor.position.y = 0.08; penFloor.receiveShadow = true; pen.add(penFloor);
  // Hàng rào 4 cạnh
  const fenceMat = new THREE.MeshStandardMaterial({ color: 0x5c4033 });
  const fencePositions = [
    [0, 0.6, 2.5, 5.2, 1.2, 0.15],
    [0, 0.6, -2.5, 5.2, 1.2, 0.15],
    [2.5, 0.6, 0, 0.15, 1.2, 5.2],
    [-2.5, 0.6, 0, 0.15, 1.2, 5.2],
  ];
  fencePositions.forEach(([x,y,z,w,h,d])=>{
    const f = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), fenceMat);
    f.position.set(x,y,z); f.castShadow = true; pen.add(f);
  });
  // Cột góc
  for(const [x,z] of [[2.5,2.5],[2.5,-2.5],[-2.5,2.5],[-2.5,-2.5]]){
    const post = new THREE.Mesh(new THREE.BoxGeometry(0.25,1.5,0.25), fenceMat);
    post.position.set(x, 0.75, z); pen.add(post);
  }
  // Ổ trứng giữa chuồng
  const nest = new THREE.Mesh(
    new THREE.CylinderGeometry(1.3, 1.5, 0.35, 12),
    new THREE.MeshStandardMaterial({ color: 0x6b4226, roughness: 1 })
  );
  nest.position.y = 0.25; pen.add(nest);
  // Biển hiệu
  const canvasP = document.createElement('canvas');
  canvasP.width = 256; canvasP.height = 64;
  const ctxP = canvasP.getContext('2d');
  ctxP.fillStyle = '#1a1208'; ctxP.fillRect(0,0,256,64);
  ctxP.fillStyle = '#fbbf24'; ctxP.font = 'bold 22px Arial'; ctxP.textAlign = 'center';
  ctxP.fillText('🥚 CHUỒNG ẤP', 128, 40);
  const labelP = new THREE.Mesh(
    new THREE.PlaneGeometry(3, 0.75),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(canvasP), transparent: true, side: THREE.DoubleSide })
  );
  labelP.position.set(0, 2.2, 0); pen.add(labelP);

  pen.position.set(-4.5, 0, 4);
  scene.add(pen);
  window.__pen = pen;
}
createMap();

function createEggMesh(rarity='common'){
  const g=new THREE.Group();
  const colors={common:0xf5d0a9,uncommon:0x86efac,rare:0x93c5fd,legendary:0xfbbf24,divine:0xf9a8d4};
  const body=new THREE.Mesh(new THREE.SphereGeometry(0.42,14,12), new THREE.MeshStandardMaterial({color:colors[rarity]||0xf5d0a9,roughness:0.35,metalness:0.15}));
  body.scale.set(1,1.28,1); body.castShadow=true; g.add(body);
  const spotMat=new THREE.MeshStandardMaterial({color:rarity==='legendary'||rarity==='divine'?0xffffff:0xd4a574});
  for(let i=0;i<6;i++){
    const s=new THREE.Mesh(new THREE.SphereGeometry(0.07+Math.random()*0.04,6,6),spotMat);
    const a=Math.random()*Math.PI*2;
    s.position.set(Math.cos(a)*0.28,(Math.random()-0.3)*0.55,Math.sin(a)*0.28+0.15); g.add(s);
  }
  if(rarity==='divine'||rarity==='legendary'){
    const ring=new THREE.Mesh(new THREE.TorusGeometry(0.55,0.04,8,24), new THREE.MeshStandardMaterial({color:0xfbbf24,emissive:0xf59e0b,emissiveIntensity:0.6}));
    ring.rotation.x=Math.PI/2; ring.position.y=0.15; g.add(ring);
  }
  return g;
}

function spawnEggs(){
  BIOMES.forEach(b=>{
    if(!b.egg) return;
    [[-4,b.z-3],[4,b.z-1],[0,b.z-6]].forEach(([x,z])=>{
      const egg=createEggMesh(b.rarity); egg.position.set(x,0.55,z);
      egg.userData={biome:b,collected:false}; scene.add(egg); eggs.push(egg);
      const nest=new THREE.Mesh(new THREE.CylinderGeometry(0.9,1.1,0.35,10), new THREE.MeshStandardMaterial({color:0x6b4226,roughness:1}));
      nest.position.set(x,0.18,z); nest.receiveShadow=true; scene.add(nest);
    });
  });
}
spawnEggs();

function createGuardian(biome){
  const g=new THREE.Group(); const type=biome.guardian;

  if(type==='Cerberus'){
    // Dark fire dragon / 3-head style from screenshot
    const body=box(1.8,1.2,2.8,0x1f2937,1.0); g.add(body);
    for(let i=-1;i<=1;i++){
      const head=box(0.75,0.7,0.95,0x111827,1.7); head.position.set(i*0.6,1.7,1.1); g.add(head);
      const eye=new THREE.Mesh(new THREE.BoxGeometry(0.14,0.12,0.08),new THREE.MeshStandardMaterial({color:0xff3300,emissive:0xff2200,emissiveIntensity:1}));
      eye.position.set(i*0.6-0.18,1.75,1.55); g.add(eye);
      const eye2=eye.clone(); eye2.position.x=i*0.6+0.18; g.add(eye2);
    }
    // Fire mane
    for(let i=0;i<7;i++){
      const flame=new THREE.Mesh(new THREE.ConeGeometry(0.2,0.7+Math.random()*0.4,5),
        new THREE.MeshStandardMaterial({color:0xf97316,emissive:0xea580c,emissiveIntensity:0.9}));
      flame.position.set((Math.random()-0.5)*1.2, 2.4+Math.random()*0.3, (Math.random()-0.5)*0.8);
      g.add(flame);
    }
  }
  else if(type==='T-Rex'){
    // Green T-Rex from screenshot
    const body=box(1.5,1.4,3.0,0x65a30d,1.1); g.add(body);
    const head=box(1.2,1.0,1.5,0x84cc16,2.0); head.position.z=1.3; g.add(head);
    const jaw=box(1.0,0.35,1.0,0x4d7c0f,1.5); jaw.position.set(0,1.5,1.7); g.add(jaw);
    // Legs
    const legL=box(0.4,0.9,0.5,0x4d7c0f,0.45); legL.position.set(-0.5,0.45,0.3); g.add(legL);
    const legR=box(0.4,0.9,0.5,0x4d7c0f,0.45); legR.position.set(0.5,0.45,0.3); g.add(legR);
    // Tail
    const tail=box(0.4,0.4,1.8,0x65a30d,1.0); tail.position.set(0,1.0,-1.8); g.add(tail);
  }
  else if(type==='ArchAngel'){
    // White gold angel from screenshot
    const body=box(1.0,1.6,0.55,0xf8fafc,1.4); g.add(body);
    const head=box(0.6,0.6,0.6,0xfde68a,2.4); g.add(head);
    // Wings
    const wingL=box(0.2,1.5,2.2,0xfbbf24,1.7); wingL.position.set(-1.0,1.7,-0.3); g.add(wingL);
    const wingR=box(0.2,1.5,2.2,0xfbbf24,1.7); wingR.position.set(1.0,1.7,-0.3); g.add(wingR);
    // Halo
    const halo=new THREE.Mesh(new THREE.TorusGeometry(0.5,0.07,8,24),
      new THREE.MeshStandardMaterial({color:0xfbbf24,emissive:0xf59e0b,emissiveIntensity:0.9}));
    halo.rotation.x=Math.PI/2; halo.position.y=2.9; g.add(halo);
    // Staff
    const staff=box(0.08,2.2,0.08,0xfbbf24,1.5); staff.position.set(0.7,1.5,0.3); g.add(staff);
  }
  else if(type==='Gorilla'){
    // Gorilla King - closer to screenshot
    // Body
    const body=box(2.0,1.8,1.5,0x111827,1.4); g.add(body);
    // Chest fur
    const chest=box(1.6,1.0,0.4,0x1f2937,1.5); chest.position.z=0.6; g.add(chest);
    // Head
    const head=box(1.4,1.2,1.3,0x0a0a0a,2.7); g.add(head);
    // Snout
    const snout=box(0.9,0.6,0.7,0x1f2937,2.4); snout.position.z=0.7; g.add(snout);
    // Red glowing eyes
    const eyeMat=new THREE.MeshStandardMaterial({color:0xff0000,emissive:0xff0000,emissiveIntensity:1.2});
    const eyeL=new THREE.Mesh(new THREE.BoxGeometry(0.22,0.16,0.1),eyeMat);
    eyeL.position.set(-0.38,2.8,0.65); g.add(eyeL);
    const eyeR=eyeL.clone(); eyeR.position.x=0.38; g.add(eyeR);
    // Open mouth
    const mouth=box(0.7,0.35,0.5,0x7f1d1d,2.15); mouth.position.z=0.75; g.add(mouth);
    // Golden crown
    const crownBase=box(1.2,0.3,1.2,0xfbbf24,3.4); g.add(crownBase);
    for(let i=0;i<5;i++){
      const spike=new THREE.Mesh(new THREE.ConeGeometry(0.12,0.45,4),new THREE.MeshStandardMaterial({color:0xf59e0b,metalness:0.6}));
      const a=(i/5)*Math.PI*2;
      spike.position.set(Math.cos(a)*0.45, 3.7, Math.sin(a)*0.45);
      g.add(spike);
    }
    // Big arms
    const armL=box(0.65,1.6,0.6,0x111827,1.1); armL.position.set(-1.4,1.1,0.2); g.add(armL);
    const armR=box(0.65,1.6,0.6,0x111827,1.1); armR.position.set(1.4,1.1,0.2); g.add(armR);
    // Fists
    const fistL=box(0.7,0.5,0.7,0x0a0a0a,0.35); fistL.position.set(-1.4,0.35,0.3); g.add(fistL);
    const fistR=box(0.7,0.5,0.7,0x0a0a0a,0.35); fistR.position.set(1.4,0.35,0.3); g.add(fistR);
    // Legs
    const legL=box(0.55,0.9,0.6,0x111827,0.45); legL.position.set(-0.5,0.45,0); g.add(legL);
    const legR=box(0.55,0.9,0.6,0x111827,0.45); legR.position.set(0.5,0.45,0); g.add(legR);
  }
  else if(type==='Whale'){
    // White whale / Moby
    const body=box(2.2,1.6,4.5,0xf1f5f9,1.2); g.add(body);
    const head=box(1.8,1.4,1.8,0xe2e8f0,1.3); head.position.z=2.5; g.add(head);
    // Mouth
    const mouth=box(1.4,0.4,0.8,0xef4444,0.9); mouth.position.set(0,0.9,3.2); g.add(mouth);
    // Tail
    const tail=box(0.3,1.2,1.5,0xe2e8f0,1.2); tail.position.set(0,1.2,-2.8); g.add(tail);
  }
  else if(type==='Kitsune'){
    // White fox / kitsune with pink accents
    const body=box(1.2,0.9,2.2,0xf8fafc,0.8); g.add(body);
    const head=box(0.9,0.8,0.9,0xf1f5f9,1.6); head.position.z=1.0; g.add(head);
    // Ears
    const earL=box(0.25,0.5,0.2,0xf9a8d4,2.15); earL.position.set(-0.35,2.15,1.0); g.add(earL);
    const earR=box(0.25,0.5,0.2,0xf9a8d4,2.15); earR.position.set(0.35,2.15,1.0); g.add(earR);
    // Tail
    const tail=box(0.4,0.4,1.6,0xf9a8d4,0.9); tail.position.set(0,0.9,-1.6); g.add(tail);
    // Markings
    const mark=box(0.6,0.15,0.15,0xf43f5e,1.65); mark.position.set(0,1.65,1.4); g.add(mark);
  }
  else {
    // Default small guardians
    const col = type==='Chicken' ? 0xfef3c7 : type==='Swan' ? 0xe0f2fe : 0xa8a29e;
    g.add(box(1.1,1.0,1.5,col,0.85));
    const head=box(0.7,0.6,0.7,col,1.55); head.position.z=0.5; g.add(head);
  }

  g.position.set(0,0,biome.z+8);
  g.userData={biome, home:new THREE.Vector3(0,0,biome.z+8), chase:false, speed:5.5+(biome.speed>1000000?3:0)};
  scene.add(g); guardians.push(g);
}
BIOMES.forEach(b=>{ if(b.guardian) createGuardian(b); });

function spawnPetFollow(){
  if(petMesh){ scene.remove(petMesh); petMesh=null; }
  if(save.pets.length===0) return;
  const g=new THREE.Group();
  g.add(box(0.55,0.45,0.7,0xfbbf24,0.4));
  const head=box(0.4,0.4,0.4,0xfde68a,0.85); head.position.z=0.25; g.add(head);
  g.position.copy(player.position); g.position.x-=1.4; scene.add(g); petMesh=g;
}

window.addEventListener('keydown',e=>{ keys[e.code]=true; if(e.code==='KeyE') doAction(); });
window.addEventListener('keyup',e=>{ keys[e.code]=false; });
const joyZone=document.getElementById('joy-zone'), joyKnob=document.getElementById('joy-knob');
let joyId=null;
function setJoy(x,y){ const max=39,len=Math.hypot(x,y)||1; if(len>max){x=x/len*max;y=y/len*max;} joyKnob.style.left=(39+x)+'px'; joyKnob.style.top=(39+y)+'px'; joyX=x/max; joyY=y/max; }
joyZone.addEventListener('touchstart',e=>{ e.preventDefault(); const t=e.changedTouches[0]; joyId=t.identifier; const r=joyZone.getBoundingClientRect(); setJoy(t.clientX-r.left-70,t.clientY-r.top-70); },{passive:false});
joyZone.addEventListener('touchmove',e=>{ e.preventDefault(); for(const t of e.changedTouches) if(t.identifier===joyId){ const r=joyZone.getBoundingClientRect(); setJoy(t.clientX-r.left-70,t.clientY-r.top-70);} },{passive:false});
function endJoy(e){ for(const t of e.changedTouches) if(t.identifier===joyId){ joyId=null; setJoy(0,0);} }
joyZone.addEventListener('touchend',endJoy); joyZone.addEventListener('touchcancel',endJoy);

document.getElementById('btn-action').onclick=doAction;
document.getElementById('btn-treadmill').onclick=()=>{
  // Đưa người chơi đến máy chạy bộ
  player.position.set(4.5, 0, 4);
  toast('Đã đến Máy chạy bộ! Chạy tại chỗ (giữ W) để tăng Speed');
};
document.getElementById('btn-base').onclick=()=>{ player.position.set(0,0,3); toast('Đã về Base'); };
document.getElementById('btn-pets').onclick=openPetsPanel;
document.getElementById('panel-close').onclick=()=>{ document.getElementById('panel').style.display='none'; };

function openPetsPanel(){
  const body=document.getElementById('panel-body');
  document.getElementById('panel-title').textContent='🐣 Pets của bạn';
  if(save.pets.length===0) body.innerHTML='<div style="opacity:.8;padding:8px 0">Chưa có pet nào. Hãy cướp trứng và mang về Base!</div>';
  else {
    let html='', total=0;
    save.pets.forEach(p=>{ total+=p.income; html+=`<div class="row"><span>${p.name}</span><span><span class="rarity ${p.rarity||'common'}">${(p.rarity||'common').toUpperCase()}</span> $${p.income.toLocaleString()}/s</span></div>`; });
    html+=`<div class="row" style="margin-top:8px;font-weight:800;color:#4ade80"><span>Tổng thu nhập</span><span>$${total.toLocaleString()}/s</span></div>`;
    body.innerHTML=html;
  }
  document.getElementById('panel').style.display='block';
}

function doAction(){
  if(save.carrying){
    // Phải đứng trong chuồng ấp (gần -4.5, 4)
    const pdx = player.position.x + 4.5;
    const pdz = player.position.z - 4;
    const inPen = (pdx*pdx + pdz*pdz < 12);
    if(inPen){
      const egg=save.carrying;
      save.pets.push({name:egg.name.replace(' Egg',''), income:egg.income, rarity:egg.rarity});
      save.money+=Math.floor(egg.income*6);
      save.carrying=null;
      if(carryingMesh){ player.remove(carryingMesh); carryingMesh=null; }
      guardians.forEach(g=>g.userData.chase=false);
      spawnPetFollow();
      toast('✨ Ấp thành công trong chuồng! '+egg.name+' +$'+Math.floor(egg.income*6).toLocaleString());
      updateHUD();
    } else if(player.position.z > -8){
      toast('Hãy mang trứng vào CHUỒNG ẤP (bên trái Base) rồi nhấn E');
    } else {
      toast('Chạy về Base → vào Chuồng ấp để nở trứng!');
    }
    return;
  }
  const px=player.position.x, pz=player.position.z;
  let nearest=null, best=999;
  for(const egg of eggs){
    if(egg.userData.collected) continue;
    const d=Math.hypot(egg.position.x-px, egg.position.z-pz);
    if(d<best && d<2.8){ best=d; nearest=egg; }
  }
  if(!nearest){ toast('Không có trứng gần đây'); return; }
  const b=nearest.userData.biome;
  if(save.speed < b.speed){ toast('Cần '+b.speed.toLocaleString()+' Speed để cướp ở '+b.name); return; }
  nearest.userData.collected=true; nearest.visible=false;
  save.carrying={name:b.egg, income:b.income, rarity:b.rarity, biome:b.name};
  if(carryingMesh) player.remove(carryingMesh);
  carryingMesh=createEggMesh(b.rarity); carryingMesh.scale.setScalar(0.65);
  player.add(carryingMesh); carryingMesh.position.set(0,2.15,0.45);
  guardians.forEach(g=>{ if(g.userData.biome.id===b.id) g.userData.chase=true; });
  toast('🥚 Đã cướp '+b.egg+'! Chạy về Base!');
  document.getElementById('prompt').style.display='none';
}

function updatePlayer(dt){
  let mx=0, mz=0;
  if(keys['KeyW']||keys['ArrowUp']) mz-=1;
  if(keys['KeyS']||keys['ArrowDown']) mz+=1;
  if(keys['KeyA']||keys['ArrowLeft']) mx-=1;
  if(keys['KeyD']||keys['ArrowRight']) mx+=1;
  mx+=joyX; mz+=joyY;
  const len=Math.hypot(mx,mz);
  if(len>0.08){
    mx/=len; mz/=len;
    const sprint=(keys['ShiftLeft']||keys['ShiftRight'])?1.55:1;
    const carrySlow=save.carrying?0.72:1;
    const speedMul=0.75+Math.min(save.speed/80000,2.2);
    const speed=6.8*sprint*speedMul*carrySlow;
    player.position.x+=mx*speed*dt; player.position.z+=mz*speed*dt;
    player.rotation.y=Math.atan2(mx,mz);
    const swing=Math.sin(animT*13)*0.55;
    const legs=player.userData.legs, arms=player.userData.arms;
    if(legs){ legs[0].rotation.x=swing; legs[1].rotation.x=-swing; }
    if(arms){ arms[0].rotation.x=-swing*0.65; arms[1].rotation.x=swing*0.65; }
  } else {
    const legs=player.userData.legs, arms=player.userData.arms;
    if(legs){ legs[0].rotation.x*=0.85; legs[1].rotation.x*=0.85; }
    if(arms){ arms[0].rotation.x*=0.85; arms[1].rotation.x*=0.85; }
  }
  player.position.x=Math.max(-11,Math.min(11,player.position.x));
  player.position.z=Math.max(-265,Math.min(10,player.position.z));

  // Tập trên máy chạy bộ — đứng lên là tự tăng Speed
  if(window.__treadmill){
    const dx = player.position.x - 4.5;
    const dz = player.position.z - 4;
    const onTreadmill = (dx*dx + dz*dz < 5.5);
    if(onTreadmill){
      if(!window.__tmAcc) window.__tmAcc = 0;
      window.__tmAcc += dt;
      if(window.__tmAcc > 0.4){
        window.__tmAcc = 0;
        const gain = 100 + Math.floor(Math.random()*150);
        save.speed += gain;
        updateHUD();
        if(Math.random() < 0.4) toast('⚡ Treadmill +' + gain + ' Speed');
      }
      // Animation chân khi đứng trên máy
      if(player.userData.legs){
        const swing = Math.sin(animT * 14) * 0.5;
        player.userData.legs[0].rotation.x = swing;
        player.userData.legs[1].rotation.x = -swing;
      }
    }
  }
}

function updateGuardians(dt){
  guardians.forEach(g=>{
    if(g.userData.chase && save.carrying){
      const dx=player.position.x-g.position.x, dz=player.position.z-g.position.z;
      const dist=Math.hypot(dx,dz)||1;
      g.position.x+=(dx/dist)*g.userData.speed*dt;
      g.position.z+=(dz/dist)*g.userData.speed*dt;
      g.lookAt(player.position.x,0,player.position.z);
      if(dist<2.0){
        toast('💀 Guardian bắt được bạn! Mất trứng');
        save.carrying=null;
        if(carryingMesh){ player.remove(carryingMesh); carryingMesh=null; }
        g.userData.chase=false; g.position.copy(g.userData.home);
      }
    } else g.position.lerp(g.userData.home, 3*dt);
  });
}

function updatePet(dt){
  if(!petMesh) return;
  const target=new THREE.Vector3(player.position.x-Math.sin(player.rotation.y)*1.5, 0, player.position.z-Math.cos(player.rotation.y)*1.5);
  petMesh.position.lerp(target, 1-Math.pow(0.04,dt));
  petMesh.lookAt(player.position.x,0.3,player.position.z);
}

function updateCamera(dt){
  const tx=player.position.x, tz=player.position.z+10;
  camera.position.x+=(tx-camera.position.x)*5*dt;
  camera.position.z+=(tz-camera.position.z)*5*dt;
  camera.position.y+=(7-camera.position.y)*5*dt;
  camera.lookAt(player.position.x, player.position.y+1.5, player.position.z);
}

function updatePrompt(){
  const el=document.getElementById('prompt');
  if(save.carrying){ el.style.display='block'; el.textContent='Đang cầm '+save.carrying.name+' — mang vào CHUỒNG ẤP rồi nhấn E'; return; }
  const px=player.position.x, pz=player.position.z;
  let near=false;
  for(const egg of eggs){ if(egg.userData.collected) continue; if(Math.hypot(egg.position.x-px,egg.position.z-pz)<3.2){ near=true; break; } }
  el.style.display=near?'block':'none';
  if(near) el.textContent='Nhấn E hoặc nút 🥚 để cướp trứng';
}

let incomeAcc=0;
function updateIncome(dt){
  if(save.pets.length===0) return;
  incomeAcc+=dt;
  if(incomeAcc>1.2){ incomeAcc=0; const total=save.pets.reduce((s,p)=>s+p.income,0); save.money+=Math.max(1,Math.floor(total*0.4)); updateHUD(); }
}

let last=performance.now();
function animate(now){
  const dt=Math.min((now-last)/1000,0.05); last=now; animT+=dt;
  updatePlayer(dt); updateGuardians(dt); updatePet(dt); updateCamera(dt); updatePrompt(); updateIncome(dt);
  eggs.forEach(e=>{ if(!e.userData.collected) e.position.y=0.55+Math.sin(animT*2+e.position.x)*0.06; });
  renderer.render(scene,camera); requestAnimationFrame(animate);
}

function startGame(){
  try {
    document.getElementById('start').style.display='none';
    updateHUD();
    toast('Chào mừng đến Steal An Egg!');
    requestAnimationFrame(animate);
  } catch(e) {
    console.error(e);
    alert('Lỗi: ' + e.message);
  }
}
const playBtn = document.getElementById('play');
if(playBtn){
  playBtn.onclick = startGame;
  playBtn.addEventListener('touchend', function(e){ e.preventDefault(); startGame(); }, {passive:false});
}
window.addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
</script>
